name: 🐞 Сообщить об ошибке
description: Что-то работает не так в ManaApp
title: "[Ошибка] "
labels: ["ошибка"]
body:
  - type: markdown
    attributes:
      value: |
        Спасибо, что помогаете сделать ManaApp лучше! Заполните поля — так ошибку получится быстро повторить и исправить.
        Версия программы видна в «Профиле» (кнопка в верхней панели).

  - type: input
    id: version
    attributes:
      label: Версия программы
      placeholder: "например, 0.10.1"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Где это случилось
      options:
        - Главная
        - Модули → Кор (оверлей, обновления)
        - Модули → Твич (вход, чат, бот)
        - Игра «Пробуждение Дракона»
        - Warudo
        - Оверлей в OBS
        - Мастер первого запуска / Профиль
        - Установка или обновление
        - Другое
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Что делали
      description: По шагам, как повторить
      placeholder: |
        1. Открыл «Модули → Твич»
        2. Нажал «Войти через Twitch»
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Что ожидали
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Что получилось
      description: Можно вставить скриншот прямо сюда (Ctrl+V)
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: Как часто
      options:
        - Каждый раз
        - Иногда
        - Один раз
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: Лог
      description: Перетащите сюда файл logs\app.log из папки программы (или вставьте последние строки)
      render: text

  - type: checkboxes
    id: privacy
    attributes:
      label: Перед отправкой
      options:
        - label: Я убрал(а) из лога и скриншотов личные данные (токены, ключ оверлея)
          required: true
